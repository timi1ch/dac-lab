services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lab4}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lab4}
      HASH_SCHEME: ${HASH_SCHEME:-argon2}
      SECRET_KEY: ${SECRET_KEY:-development-only-replace-with-random-value}
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-8000}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $$PORT"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:${PORT:-8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: lab4_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab4_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: [test]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test-only-password@test-db:5432/lab4_test
      SECRET_KEY: test-only-secret-key
      ARGON2_MEMORY_COST: 8192
    command: python -m pytest -q backend/tests
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
